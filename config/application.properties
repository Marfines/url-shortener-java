# System policy. ISO-8601 durations: PT1H = one hour, PT24H = one day.
link.ttl=PT24H
link.default-limit=10
link.max-limit=1000000
link.code-length=8
link.base-url=https://short.local/
cleanup.interval=PT5S
# Relative to this configuration file, not the current working directory.
storage.file=../data/state.xml
